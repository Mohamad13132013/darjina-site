<div class="phone" role="img" aria-label="{{t:list_alt}}">
  <div class="screen">
    <div class="scr-top"><b>{{t:receipts}}</b><small>01</small></div>
    <div class="scr-body">
      <div class="scr-search scr-search--idle">{{icon:search}}<span>{{t:search_hint}}</span></div>
      <div class="scr-chips"><span class="chip chip--pending">{{t:pending}}</span><span class="chip chip--ready">{{t:ready_short}}</span></div>
      <div class="scr-card"><div class="scr-row"><bdi>26-11-01-00031</bdi><span class="chip chip--late">{{t:late_one}}</span></div><div class="scr-row scr-muted"><span>{{t:customer2}}</span><span>{{t:date1}}</span></div></div>
      <div class="scr-card"><div class="scr-row"><bdi>26-11-01-00042</bdi><span class="chip chip--pending">{{t:pending}}</span></div><div class="scr-row scr-muted"><span>{{t:customer}}</span><span>{{t:due_date}}</span></div></div>
      <div class="scr-card"><div class="scr-row"><bdi>26-11-01-00044</bdi><span class="chip chip--ready">{{t:ready_short}}</span></div><div class="scr-row scr-muted"><span>{{t:customer3}}</span><span>{{t:date3}}</span></div></div>
    </div>
  </div>
</div>
