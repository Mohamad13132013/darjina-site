<div class="phone" role="img" aria-label="{{t:pay_alt}}">
  <div class="screen">
    <div class="scr-top"><b>{{t:receipt}}</b><small>26-11-01-00042</small></div>
    <div class="scr-body">
      <div class="scr-card">
        <div class="scr-row"><span class="chip chip--ready">{{t:delivered}}</span><span class="chip chip--paid">{{t:paid_badge}}</span></div>
        <div class="scr-divider"></div>
        <div class="scr-row"><b>{{t:remaining}}</b><span class="scr-amount"><bdi>0.000</bdi> <small>{{t:cur}}</small></span></div>
        <div class="scr-progress"><span style="width:100%"></span></div>
      </div>
      <b>{{t:payments}}</b>
      <div class="scr-card"><div class="scr-row"><span>{{t:deposit}}</span><span class="scr-amount"><bdi>20.000</bdi></span></div><div class="scr-row scr-muted"><span>{{t:date0}}</span><span>{{t:branch}} 01</span></div></div>
      <div class="scr-card"><div class="scr-row"><span>{{t:payment}}</span><span class="scr-amount"><bdi>25.000</bdi></span></div><div class="scr-row scr-muted"><span>{{t:due_date}}</span><span>{{t:branch}} 01</span></div></div>
    </div>
  </div>
</div>
