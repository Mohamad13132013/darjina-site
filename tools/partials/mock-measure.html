<div class="phone" role="img" aria-label="{{t:measure_alt}}">
  <div class="screen">
    <div class="scr-top"><b>{{t:measurements}}</b><small>cm</small></div>
    <div class="scr-body">
      <div class="abaya-fig">{{> abaya-svg}}</div>
      <div class="scr-kpis">
        <div class="kpi"><span class="k">{{t:m_height}}</span><span class="v">142</span></div>
        <div class="kpi"><span class="k">{{t:m_shoulder}}</span><span class="v">40</span></div>
        <div class="kpi"><span class="k">{{t:m_sleeve}}</span><span class="v">58</span></div>
        <div class="kpi"><span class="k">{{t:m_bust}}</span><span class="v">48</span></div>
      </div>
    </div>
    <div class="scr-bottom"><div class="scr-btn">{{icon:check}}<span>{{t:save_measure}}</span></div></div>
  </div>
</div>
