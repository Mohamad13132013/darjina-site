<div class="phone" role="img" aria-label="{{t:order_alt}}">
  <div class="screen">
    <div class="scr-top"><b>{{t:shop}}</b><small>{{t:handle}}</small></div>
    <div class="scr-body">
      <div class="scr-card scr-model scr-model--on">
        <span class="scr-thumb"><img src="/assets/img/mark.webp" width="390" height="400" alt="" loading="lazy"></span>
        <div><b>{{t:model1}}</b><div class="scr-muted"><bdi>{{t:code1}}</bdi> · <span class="scr-amount"><bdi>25.000 BHD</bdi></span></div><span class="chip chip--pending">{{t:left3}}</span></div>
      </div>
      <div class="scr-card scr-model">
        <span class="scr-thumb scr-thumb--b"><img src="/assets/img/mark.webp" width="390" height="400" alt="" loading="lazy"></span>
        <div><b>{{t:model2}}</b><div class="scr-muted"><bdi>{{t:code2}}</bdi> · <span class="scr-amount"><bdi>38.000 BHD</bdi></span></div></div>
      </div>
      <div class="scr-card">
        <div class="scr-row"><span class="scr-muted">{{t:pieces_n}}</span><span class="scr-muted"><bdi>25.000 × 2</bdi></span></div>
        <div class="scr-divider"></div>
        <div class="scr-row"><b>{{t:total}}</b><span class="scr-amount"><bdi>50.000</bdi> <small>BHD</small></span></div>
      </div>
    </div>
    <div class="scr-bottom"><div class="scr-btn">{{icon:check}}<span>{{t:send_order}}</span></div></div>
  </div>
</div>
