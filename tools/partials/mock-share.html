<div class="phone" role="img" aria-label="{{t:share_alt}}">
  <div class="screen">
    <div class="scr-top"><b>{{t:pdf}}</b><small>PDF</small></div>
    <div class="scr-body">
      <div class="scr-card">
        <div class="scr-person"><span class="avatar avatar--sq">{{icon:store}}</span><div><b>{{t:shop}}</b><div class="scr-muted"><bdi>+973 1700 0000</bdi></div></div></div>
        <div class="scr-divider"></div>
        <div class="scr-row"><span class="scr-muted">{{t:receipt_no}}</span><bdi>26-11-01-00042</bdi></div>
        <div class="scr-row"><span class="scr-muted">{{t:customer_l}}</span><span>{{t:customer}}</span></div>
        <div class="scr-row"><span class="scr-muted">{{t:status}}</span><span class="chip chip--pending">{{t:pending}}</span></div>
        <div class="scr-divider"></div>
        <div class="scr-row"><span>{{t:price}}</span><span class="scr-amount"><bdi>45.000</bdi></span></div>
        <div class="scr-row"><span>{{t:paid}}</span><span class="scr-amount"><bdi>20.000</bdi></span></div>
        <div class="scr-row"><b>{{t:remaining}}</b><span class="scr-amount"><bdi>25.000</bdi> <small>{{t:cur}}</small></span></div>
      </div>
    </div>
    <div class="scr-bottom"><div class="scr-btn">{{icon:chat}}<span>{{t:send_wa}}</span></div></div>
  </div>
</div>
