<div class="phone" role="img" aria-label="{{t:receipt_alt}}">
  <div class="screen">
    <div class="scr-top"><b>{{t:receipt}}</b><small>26-11-01-00042</small></div>
    <div class="scr-body">
      <div class="scr-card scr-person"><span class="avatar">{{t:initial}}</span><div><b>{{t:customer}}</b><div class="scr-muted"><bdi>+973 •••• 4512</bdi></div></div></div>
      <div class="scr-card">
        <div class="scr-row"><span class="scr-muted">{{t:status}}</span><span class="chip chip--pending">{{t:pending}}</span></div>
        <div class="scr-divider"></div>
        <div class="scr-row"><span>{{t:price}}</span><span class="scr-amount"><bdi>45.000</bdi> <small>{{t:cur}}</small></span></div>
        <div class="scr-row"><span>{{t:paid}}</span><span class="scr-amount"><bdi>20.000</bdi> <small>{{t:cur}}</small></span></div>
        <div class="scr-row"><b>{{t:remaining}}</b><span class="scr-amount"><bdi>25.000</bdi> <small>{{t:cur}}</small></span></div>
        <div class="scr-progress"><span style="width:44%"></span></div>
      </div>
      <div class="scr-card scr-row"><span class="scr-muted">{{t:due}}</span><b>{{t:due_date}}</b></div>
      <div class="scr-card scr-row"><span class="scr-muted">{{t:pieces}}</span><b>2</b></div>
    </div>
    <div class="scr-bottom"><div class="scr-btn">{{icon:share}}<span>{{t:share_pdf}}</span></div></div>
  </div>
</div>
