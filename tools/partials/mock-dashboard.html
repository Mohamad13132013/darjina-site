<div class="phone" role="img" aria-label="{{t:dash_alt}}">
  <div class="screen">
    <div class="scr-top"><b>{{t:dashboard}}</b><small>{{t:today}}</small></div>
    <div class="scr-body">
      <div class="scr-kpis">
        <div class="kpi kpi--dark"><span class="k">{{t:owed}}</span><span class="v"><bdi>1,240.500</bdi> <small>{{t:cur}}</small></span></div>
        <div class="kpi"><span class="k">{{t:late}}</span><span class="v late">3</span></div>
        <div class="kpi"><span class="k">{{t:due_today}}</span><span class="v">5</span></div>
        <div class="kpi"><span class="k">{{t:ready}}</span><span class="v">8</span></div>
        <div class="kpi"><span class="k">{{t:collected}}</span><span class="v">186.000</span></div>
      </div>
      <div class="scr-card">
        <div class="scr-row"><b>{{t:orders_week}}</b><span class="scr-muted"><bdi>+12%</bdi></span></div>
        <div class="bars"><span style="height:45%"></span><span style="height:60%"></span><span style="height:38%"></span><span style="height:72%"></span><span style="height:55%"></span><span class="hi" style="height:92%"></span><span style="height:66%"></span></div>
      </div>
      <div class="scr-card scr-row"><span class="scr-muted">{{t:branch}} 01</span><span class="chip chip--ready">{{t:ready_short}} 5</span></div>
    </div>
  </div>
</div>
