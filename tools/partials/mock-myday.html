<div class="phone" role="img" aria-label="{{t:myday_alt}}">
  <div class="screen">
    <div class="scr-top"><b>{{t:myday}}</b><small>{{t:branch}} 01</small></div>
    <div class="scr-body">
      <div class="scr-kpis">
        <div class="kpi kpi--dark"><span class="k">{{t:i_collected}}</span><span class="v"><bdi>64.500</bdi> <small>{{t:cur}}</small></span></div>
        <div class="kpi"><span class="k">{{t:pending}}</span><span class="v">12</span></div>
        <div class="kpi"><span class="k">{{t:ready_short}}</span><span class="v">4</span></div>
      </div>
      <div class="scr-card">
        <div class="scr-row"><b>{{t:my_rank}}</b><span class="chip chip--ready"><bdi>2 / 6</bdi></span></div>
        <div class="scr-divider"></div>
        <div class="scr-row scr-muted"><span>{{t:best}}</span><span>9</span></div>
        <div class="scr-progress"><span style="width:100%"></span></div>
        <div class="scr-row"><b>{{t:you}}</b><b>7</b></div>
        <div class="scr-progress"><span class="me" style="width:78%"></span></div>
        <div class="scr-row scr-muted"><span>{{t:lowest}}</span><span>3</span></div>
        <div class="scr-progress"><span style="width:33%"></span></div>
      </div>
    </div>
  </div>
</div>
